<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with our Team</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- فایل CSS خودمان -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="contact-section py-5">
    <div class="container">
      <div class="contact-card">
        <div class="row g-4 align-items-center">

          <!-- ستون چپ: فرم -->
          <div class="col-lg-6">
            <div class="contact-form-wrap">
              <h2 class="contact-title">Chat with our Team</h2>
              <p class="contact-subtitle">Need to help with something?</p>

              <form id="contactForm" novalidate>
                <!-- نام و نام خانوادگی -->
                <div class="row g-2 mb-4">
                  <div class="col-6">
                    <input type="text" class="form-control contact-input" id="firstName"
                           placeholder="First Name" required>
                    <div class="invalid-feedback">Enter your first name.</div>
                  </div>
                  <div class="col-6">
                    <input type="text" class="form-control contact-input" id="lastName"
                           placeholder="Last Name" required>
                    <div class="invalid-feedback">Enter your last name.</div>
                  </div>
                </div>

                <!-- ایمیل -->
                <div class="mb-4">
                  <input type="email" class="form-control contact-input" id="email"
                         placeholder="Email" required>
                  <div class="invalid-feedback">Enter a valid email address.</div>
                </div>

                <!-- تلفن -->
                <div class="mb-4">
                  <input type="tel" class="form-control contact-input" id="phone"
                         placeholder="Phone" pattern="[0-9+\-\s()]{7,}" required>
                  <div class="invalid-feedback">Enter a valid phone number.</div>
                </div>

                <!-- پیام -->
                <div class="mb-4">
                  <textarea class="form-control contact-input" id="message" rows="4"
                            placeholder="Message" required></textarea>
                  <div class="invalid-feedback">Write a short message.</div>
                </div>

                <button type="submit" class="btn contact-btn w-100">Get in touch</button>

                <div id="formSuccess" class="form-success" role="status" hidden>
                  Thanks! We got your message and will reply soon.
                </div>
              </form>
            </div>
          </div>

          <!-- ستون راست: عکس -->
          <div class="col-lg-6">
            <img src="images/pasta.jpg" alt="Chef tossing shrimp pasta in a pan"
                 class="contact-img">
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- فایل جاوا اسکریپت خودمان -->
  <script src="script.js"></script>
</body>
</html>
