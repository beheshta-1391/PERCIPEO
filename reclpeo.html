<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipeo - Discover, Cook, Enjoy</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERCIPEO - Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="wrap nav">

        <div class="logo">
            <span class="mark">P</span>
            PERCIPEO
        </div>

        <nav class="navlinks" id="navlinks">
            <a class="active" href="#hero">Home</a>
            <a href="#latest">Recipes</a>
            <a href="#feature">Best</a>
            <a href="#favorite">Favorite</a>
            <a href="#articles">Blog</a>
        </nav>

        <div class="tools">

            <button class="iconbtn" id="cartBtn"
                aria-label="Shopping cart" title="Shopping cart">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </button>

            <button class="iconbtn" id="themeBtn"
                title="Change theme" aria-label="Change theme">
                🌙
            </button>

            <button class="iconbtn" id="favFilter"
                title="Show favorites" aria-label="Show favorites">
                💖
            </button>

            <button class="iconbtn burger" id="burger"
                aria-label="Open menu">
                ☰
            </button>

        </div>
    </div>

    <div class="cart-panel" id="cartPanel">
        <strong>سبد خرید</strong>
        <p>هنوز محصولی به سبد خرید اضافه نشده است.</p>
    </div>

</header>


</body>
</html>
    <div class="container">
      <!-- HEADER -->
      <header class="header">
        <div>
          <h1>RECIPEO<span>.</span></h1>
          <p>Discover. Cook. Enjoy.</p>
        </div>

        <div class="search">
          <input
            type="search"
            id="searchInput"
            placeholder="Search recipes..."
          />
          <button id="searchBtn">⌕</button>
        </div>
      </header>

      <!-- CATEGORIES -->
      <section class="section">
        <div class="section-heading">
          <h2>Categories</h2>
        </div>

        <div class="carousel">
          <button class="arrow" id="catPrev">‹</button>
          <div class="track-window" id="catWindow">
            <div class="track" id="categoryTrack"></div>
          </div>
          <button class="arrow" id="catNext">›</button>
        </div>
      </section>

      <!-- FEATURED RECIPES -->
      <section class="section">
        <div class="section-heading">
          <h2>Discover Recipes</h2>
          <span>Explore our delicious meals</span>
        </div>

        <div class="carousel">
          <button class="arrow" id="featuredPrev">‹</button>
          <div class="track-window" id="featuredWindow">
            <div class="track" id="featuredTrack"></div>
          </div>
          <button class="arrow" id="featuredNext">›</button>
        </div>
      </section>

      <!-- POPULAR RECIPES -->
      <section class="section">
        <div class="section-heading">
          <h2>Popular Recipes</h2>
        </div>

        <div class="carousel">
          <button class="arrow" id="popularPrev">‹</button>
          <div class="track-window" id="popularWindow">
            <div class="track" id="popularTrack"></div>
          </div>
          <button class="arrow" id="popularNext">›</button>
          
        </div>
      </section>

     
  </body>
</html>
